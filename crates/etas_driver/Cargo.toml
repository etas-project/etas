[package]
name = "etas_driver"
version = "0.8.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
forbid-legacy-std = ["etas_std/forbid-legacy-registry"]

[dependencies]
etas_core.workspace = true
etas_code.workspace = true
etas_host.workspace = true
etas_effects.workspace = true
etas_frontend.workspace = true
etas_hir.workspace = true
etas_package.workspace = true
etas_package_metadata.workspace = true
etas_std.workspace = true
etas_syntax.workspace = true
etas_types.workspace = true
etas_utils.workspace = true
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
ciborium.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.6", features = ["fs"] }

[build-dependencies]
etas_std.workspace = true

[dev-dependencies]
bincode = { version = "2.0.1", features = ["serde"] }
tokio.workspace = true
etas_interpreter.workspace = true
