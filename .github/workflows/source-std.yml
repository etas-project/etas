name: Source standard library

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Build without the legacy registry
        run: cargo +stable build --locked --release -p etas_cli --features forbid-legacy-std
      - name: Install the complete source standard library
        shell: bash
        run: |
          target/release/etas --no-config --cache off std install --prefix "$RUNNER_TEMP/etas-sdk"
          mv "$RUNNER_TEMP/etas-sdk" "$RUNNER_TEMP/etas-sdk-relocated"
      - name: Run outside the repository after moving the installation
        run: |
          python3 scripts/ci/validate_std_sdk.py \
            --binary "$RUNNER_TEMP/etas-sdk-relocated/bin/etas" \
            --receipt-dir "$RUNNER_TEMP/std-sdk-receipts"
      - name: Verify source additions and body changes
        run: |
          cargo +stable test --locked --release -p etas_cli --features forbid-legacy-std --test cli \
            std_source_sdk:: -- --nocapture --test-threads=1
      - name: Compare installed APIs with the locked legacy registry
        run: |
          cargo +stable run --locked --release -p etas_driver --example std_sdk_inventory -- \
            "$RUNNER_TEMP"/etas-sdk-relocated/lib/etas/* --compare-legacy \
            > "$RUNNER_TEMP/std-sdk-api-diff.json"
      - uses: actions/upload-artifact@v4
        with:
          name: std-sdk-api-diff
          path: ${{ runner.temp }}/std-sdk-api-diff.json
