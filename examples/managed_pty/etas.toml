[package]
name = "managed-pty"
version = "0.1.0"
edition = "2026"

[source]
root = "src"

[dependencies]
std = { version = ">=0.11" }

[[bin]]
name = "managed-pty"
module = "app"
flow = "main"

[runtime]
default_profile = "terminal"

[runtime.profiles.terminal.command]
allow = ["/bin/sh"]
isolation = "trusted-unconfined"
pty = true

[runtime.profiles.terminal.policy]
mode = "local-static"
rules = ["command=allow", "pty=allow"]
